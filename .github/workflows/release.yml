name: "Release SDK"

on:
  # Weekly release runs after the scheduled AlgoFam Greeting job completes
  # (instead of its own cron) so it is always ordered after the greeting.
  workflow_run:
    workflows: ["AlgoFam Greeting"]
    types: [completed]

  workflow_dispatch:
  workflow_call:

jobs:
  # When triggered by the greeting workflow (scheduled or manual run), only release
  # on Mondays (Pacific time) after a successful greeting, and only if a release
  # hasn't already been published today (so greeting re-runs don't release twice).
  check-release-trigger:
    name: "Check release trigger"
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          should_release=true
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            today=$(TZ=America/Los_Angeles date +%F)
            day_of_week=$(TZ=America/Los_Angeles date +%u)
            latest_published=$(gh api "repos/${{ github.repository }}/releases/latest" --jq .published_at 2>/dev/null || true)
            latest_release_day=""
            if [ -n "$latest_published" ]; then
              latest_release_day=$(TZ=America/Los_Angeles date -d "$latest_published" +%F)
            fi
            echo "today=$today day_of_week=$day_of_week upstream_conclusion=$UPSTREAM_CONCLUSION latest_release_day=$latest_release_day"
            if [ "$UPSTREAM_CONCLUSION" != "success" ] \
              || [ "$day_of_week" != "1" ] \
              || [ "$latest_release_day" = "$today" ]; then
              should_release=false
            fi
          fi
          echo "should_release=$should_release"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"

  # SDK release is done from public main branch.
  confirm-public-repo-main-branch:
    name: "Confirm release is run from public/main branch"
    needs: check-release-trigger
    if: needs.check-release-trigger.outputs.should_release == 'true'
    uses: michaeltchuangllc/.github/.github/workflows/release-branch-context-check.yml@main

  create-release-branch:
    name: "Create Release Branch"
    runs-on: ubuntu-latest
    needs: confirm-public-repo-main-branch
    env:
      GITHUB_TOKEN: ${{ secrets.MICHAELTCHUANG_BOT }}
      GIT_AUTHOR_NAME: michaeltchuang
      GIT_AUTHOR_EMAIL: github@michaeltchuang.com
      GIT_COMMITTER_NAME: michaeltchuang
      GIT_COMMITTER_EMAIL: github@michaeltchuang.com
    steps:
      - name: "Checkout main branch"
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.MICHAELTCHUANG_BOT }}
          repository: michaeltchuang/a-day-in-my-bobalife
          ref: main
          submodules: recursive
      - name: "Import GPG Key"
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
      - name: "Create and push release branch"
        run: |
          git checkout -b release/${{ github.run_number }}
          git push origin release/${{ github.run_number }}

  semantic-release:
    name: "Semantic Release"
    needs: create-release-branch
    runs-on: macos-latest
    env:
      GITHUB_TOKEN: ${{ secrets.MICHAELTCHUANG_BOT }}
      GIT_AUTHOR_NAME: michaeltchuang
      GIT_AUTHOR_EMAIL: github@michaeltchuang.com
      GIT_COMMITTER_NAME: michaeltchuang
      GIT_COMMITTER_EMAIL: github@michaeltchuang.com
    steps:
      - name: "Checkout main branch"
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.MICHAELTCHUANG_BOT }}
          fetch-depth: 0
          ref: main
      - name: "Import GPG Key"
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_commit_gpgsign: true
      - name: "Merge release branch into main branch"
        run: |
          git pull origin release/${{ github.run_number }}
      - name: "Semantic Release"
        working-directory: HaveAMagicalDay
        run: |
          npx \
          -p lodash \
          -p semantic-release@17 \
          -p @semantic-release/changelog@5 \
          -p @semantic-release/git@9 \
          -p @semantic-release/exec@5 \
          -p conventional-changelog-conventionalcommits@7.0.2 \
          semantic-release
      - name: "Push automated release commits to release branch"
        run: |
          git push origin HEAD:release/${{ github.run_number }}

  sync-repository:
      name: "Sync Repository"
      needs: semantic-release
      runs-on: ubuntu-latest
      steps:
        - name: "Checkout main branch"
          uses: actions/checkout@v7
          with:
            fetch-depth: 0
            repository: ${{ github.repository }}
            token: ${{ secrets.MICHAELTCHUANG_BOT }}
            ref: main
        - name: "Merge release branch into main branch"
          run: |
            git pull origin release/${{ github.run_number }}
        - name: "Push release commits to main branch"
          run: |
            git push origin HEAD:main
        - name: "Delete release branch"
          run: |
            git push --delete origin release/${{ github.run_number }}

