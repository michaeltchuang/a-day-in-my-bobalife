[versions]
clikt = "5.1.0"
falcon-sdk = "0.0.19"
jna = "5.17.0"
json = "20240303"
junit = "4.13.2"

[libraries]
clikt = { module = "com.github.ajalt.clikt:clikt", version.ref = "clikt" }
falcon-signatures-mobile = { group = "io.github.algorandecosystem", name = "falcon-signatures-mobile-sdk", version.ref = "falcon-sdk" }
# JNA is required at runtime by the AlgoKit Rust (UniFFI) bindings below to load the bundled
# native libraries (libalgokit_*_ffi.so/.dylib) embedded in app/libs/*.jar.
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
# Minimal JSON parsing for talking to the algod REST API directly (previously handled internally
# by the Java algosdk's AlgodClient).
json = { module = "org.json:json", version.ref = "json" }
junit = { module = "junit:junit", version.ref = "junit" }
